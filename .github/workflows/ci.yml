name: CI

# This repo had no PR-triggered workflow, which under the org ruleset meant its
# PRs could never be approved: pr-auto-approve refuses to approve a PR with no
# check runs, deliberately, so an approval always rests on evidence.
#
# The evidence is the realm validating with the released CLI: realm structure,
# entity schemas, lifecycle transitions. The check job adds what those offline
# steps cannot see: the realm's dependencies and cross-realm references.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Lifecycle transitions are validated one PR at a time on the way into
  # develop. A release (the same-repository develop -> main PR, and the
  # resulting push to main) aggregates those steps, which rulediff reads as
  # skipped states (RD003) and body-edit-plus-promotion (RD001), so exactly
  # those are exempt from the diff; any other PR into main is checked.
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/
      diff: >-
        ${{ !(
          (
            github.event_name == 'pull_request'
            && github.base_ref == 'main'
            && github.head_ref == 'develop'
            && github.event.pull_request.head.repo.full_name == github.repository
          )
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        ) }}

  check:
    uses: SteerSpec/.github/.github/workflows/strspc-check.yml@main
    permissions:
      contents: read
      pull-requests: read

  # Commit types set the release version, so a mistyped commit is a wrong
  # release. Merge commits keep each commit, so the title alone would not do.
  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1
        with:
          configFile: .commitlintrc.yml
