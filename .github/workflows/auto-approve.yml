name: PR Auto-Approve (Copilot)

# Auto-approves PRs as cnslr-bt once Copilot's review is clean, satisfying the
# org ruleset's required approving review without a human click.

on:
  # SECURITY: pull_request_target, NOT pull_request. For a same-repo PR the
  # `pull_request` event runs the workflow definition from the PR's HEAD commit
  # with secrets in scope, so anyone able to push a branch could edit this file
  # in their own PR and exfiltrate BOT_TOKEN. pull_request_target "runs in the
  # context of the default branch of the base repository", so the definition is
  # never PR-controlled.
  #
  # Safe here only because this workflow never checks out PR code — the action
  # just calls the GitHub API. Do not add actions/checkout to this job.
  #
  # It also makes the fork guard in the if: below load-bearing. Do not remove it.
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review, synchronize, reopened]
  # Safe as-is: pull_request_review only triggers when the workflow file exists
  # on the default branch, so its definition is not PR-controlled either.
  pull_request_review:
    types: [submitted]
  # Catches third-party app checks. It does NOT fire for this repo's own Actions
  # jobs: those check runs are created with GITHUB_TOKEN, and GITHUB_TOKEN
  # events never start a new workflow run (the recursion guard).
  check_run:
    types: [completed]
  # ...so workflow_run is the re-entry point that works. 'CI' is this repo's
  # only PR-gating workflow; if another is ever added it MUST be listed here too,
  # because each fires its own event and only the last to finish sees every
  # check complete.
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  # The check-run name comes from `name:` below, and the check_run branch of the
  # if: excludes it by that exact string to break the feedback loop. The job key
  # is kept identical so the two cannot drift.
  auto-approve:
    name: auto-approve
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: read
    concurrency:
      group: >-
        pr-auto-approve-${{ github.repository }}-${{
          github.event.pull_request.number ||
          github.event.check_run.pull_requests[0].number ||
          github.event.workflow_run.pull_requests[0].number ||
          github.run_id
        }}
      cancel-in-progress: true
    # BASE-BRANCH SYNC — 3 points must agree: on.pull_request_target.branches
    # above, the base.ref check here, and the base-branch input below.
    #
    # 'cnslr-bt' is hard-coded rather than read from a variable: an unset
    # variable makes this `github.actor != ''`, always true, silently disabling
    # the loop guard. It MUST stay identical to the bot-login input below.
    if: >-
      (
        (
          github.event_name == 'pull_request_target' ||
          (
            github.event_name == 'pull_request_review' &&
            github.actor != 'cnslr-bt'
          )
        ) &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'check_run' &&
        github.event.check_run.name != 'auto-approve' &&
        github.event.check_run.pull_requests[0] != null
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0] != null
      )
    steps:
      - uses: SteerSpec/strspc-pr-review@v1
        with:
          bot-login: cnslr-bt
          bot-github-token: ${{ secrets.BOT_TOKEN }}
          base-branch: main
          # Copilot cannot re-trigger this workflow — its check run is
          # GITHUB_TOKEN-created, and any run Copilot itself triggers is held at
          # 'action_required' pending manual approval. So this run, started by
          # CI completing, waits for Copilot's check instead of skipping.
          # Without it every PR needs a manual re-run.
          #
          # NOTE this repo is PRIVATE, so the wait consumes billable Actions
          # minutes (it is free on public repos). Copilot typically reports in
          # ~1-3 minutes; lower this if the cost matters more than the wait.
          wait-for-copilot-seconds: '300'
