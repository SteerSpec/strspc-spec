name: Release

# release-please creates the tag and the GitHub release. This adds the rules to
# that release as archives. Nothing pins this realm yet, so there is no publish
# or pin step.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A job of its own: the CLI tracks the latest release, so it runs without the
  # write token the upload job holds.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: realm.version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(jq -r '.realm.version' rules/realm.json)"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::realm.version (${VERSION}) does not match tag $TAG"
            exit 1
          fi

      - uses: SteerSpec/strspc-CLI/.github/actions/setup-strspc@1ce43e4484d9451083c0774a9926178889d684f2  # CLI #92
        with:
          version: ${{ vars.STRSPC_CLI_VERSION || 'latest' }}

      - name: Validate realm and entity files
        run: strspc realm validate rules/ --recursive --strict

  upload:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Package rules
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "strspc-spec-${TAG#v}.tar.gz" rules/ LICENSE
          zip -r "strspc-spec-${TAG#v}.zip" rules/ LICENSE

      - name: Attach archives to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            strspc-spec-*.tar.gz
            strspc-spec-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
